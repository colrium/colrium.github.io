<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
	 border: 0;
	 box-sizing: border-box;
	 margin: 0;
	 padding: 0;
}
 /* :root {
	 --hue: 223;
	 --bg: #e8e3e3;
	 --fg: #1c1717;
     --screen-color: #202020;
     --device-color: #727272;
	 --trans-dur: 0.4s;
} */
:root {
        --trans-dur: 0.4s;
        --hue: 223;
		 --bg: #4b4b4b;
		 --fg: #ffffff;
         --screen-color: #000000;
        --device-color: #2b2b2b;
	}
/* Dark theme */
 @media (prefers-color-scheme: dark) {
	 :root {
        --trans-dur: 0.4s;
        --hue: 223;
         --screen-color: #000000;
        --device-color: #2b2b2b;
	}
}
 body {
	 background-color: var(--bg);
	 color: var(--fg);
	 display: grid;
	 place-items: center;
	 font: 1em/1.5 sans-serif;
	 height: 100vh;
	 transition: background-color var(--trans-dur), color var(--trans-dur);
}
 .device {
    font-size: calc(28px + (60 - 28) * (100vw - 280px) / (3840 - 280));
	 position: relative;
	 width: 4em;
	 height: 4em;
     color: var(--screen-color);
}

 
.device_screen, .device_home_btn, .device_watch_crown,  .device_monitor_stand_y, .device_monitor_stand_x, .watch_strap_t, .watch_strap_b, .device_shadow_a, .device_shadow_b {
	 animation: device-screen 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
     position: absolute;
	 transition: background-color var(--trans-dur), box-shadow var(--trans-dur);
}
 .device_screen {
     background-color: var(--screen-color);
     border: 0.125em solid var(--device-color);
	 box-shadow: 0 0 0 0.25em inset;
	 border-radius: 0.375em;
	 top: 0;
	 width: 4em;
	 height: 2.5em;
	 z-index: 1;
}
 .device_home_btn, .device_watch_crown {
	 visibility: hidden;
}
 .device_home_btn {
	 animation-name: device-home-btn-anim;
	 top: 2.5em;
	 left: 1.25em;
	 width: 1em;
	 height: 0.2em;
     background-color: var(--device-color);
     border-radius: 0.125em;
}
 .device_watch_crown {
	 animation-name: device-watch-crown-anim;
     background-color: var(--screen-color);
	 top: 0.625em;
	 right: 0.15em;
	 width: 0.15em;
	 height: 0.45em;
     border-radius: 0.125em;
}
.device_monitor_stand_y, .device_monitor_stand_x, .device_shadow_a, .device_shadow_b {
	 background-color: var(--device-color);
	 border-radius: 0.125em;
}
 .device_monitor_stand_y {
	 animation-name: device-monitor-stand-y-anim;
	 top: 2.25em;
	 left: 1.875em;
	 width: 0.25em;
	 height: 1em;
}
 .device_monitor_stand_x {
	 animation-name: device-monitor-stand-x-anim;
	 top: 3em;
	 left: 1em;
	 width: 2em;
	 height: 0.25em;
}
 .watch_strap_t, .watch_strap_b {
	 left: 1.25em;
	 width: 1.5em;
	 height: 0.875em;
	 visibility: hidden;
     background-color: var(--device-color);

}
 .watch_strap_t {
	 animation-name: watch-strap-t-anim;
	 border-radius: 0.375em 0.375em 0 0;
	 top: 0.75em;
}
 .watch_strap_b {
	 animation-name: watch-strap-b-anim;
	 border-radius: 0 0 0.375em 0.375em;
	 top: 1.625em;
}
 .device_shadow_a, .device_shadow_b {
    background-color: var(--screen-color);
	 filter: blur(0.375em);
	 bottom: 0;
	 height: 0.25em;
}
 .device_shadow_a {
	 animation-name: device-shadow-a-anim;
	 opacity: 0.5;
	 left: 1em;
	 width: 2em;
}
 .device_shadow_b {
	 animation-name: device-shadow-b-anim;
	 opacity: 0.75;
	 left: 0;
	 width: 4em;
}

/* Animations */
 @keyframes device-screen {
	 from, to {
		 animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
		 left: 0;
		 width: 4em;
		 height: 2.5em;
		 transform: translateY(0);
	}
	 12.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 left: 0;
		 width: 4em;
		 height: 2.5em;
		 transform: translateY(1.5em);
	}
	 25% {
		 animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
		 left: 0;
		 width: 4em;
		 height: 2.5em;
		 transform: translateY(0.375em);
	}
	 37.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 left: 0;
		 width: 4em;
		 height: 2.5em;
		 transform: translateY(1.5em);
	}
	 50% {
		 animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
		 left: 1em;
		 width: 2em;
		 height: 3em;
		 transform: translateY(0.125em);
	}
	 62.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 left: 1em;
		 width: 2em;
		 height: 3em;
		 transform: translateY(1em);
	}
	 75% {
		 animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
		 left: 1em;
		 width: 2em;
		 height: 2em;
		 transform: translateY(0.625em);
	}
	 87.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 left: 1em;
		 width: 2em;
		 height: 2em;
		 transform: translateY(1.375em);
	}
}
 @keyframes device-home-btn-anim {
	 from {
		 animation-timing-function: steps(1, end);
		 left: 1.35em;
		 width: 1em;
		 transform: translateY(-0.15em);
		 visibility: hidden;
	}
	 12.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 left: 1.35em;
		 width: 1em;
		 transform: translateY(-0.25em);
		 visibility: visible;
	}
	 25%, 37.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 left: 1.35em;
		 width: 1em;
		 transform: translateY(-0.5em);
		 visibility: visible;
	}
    /* Smart-phone next */
	 50%, 62.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 left: 0.775em;
		 width: 0.25em;
		 transform: translateY(-0.15em);
		 visibility: visible;
	}
    75%, 85% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 left: 0.875em;
		 width: 0.0;
		 transform: translateY(0);
		 visibility: hidden;
	}
	 85%, 90% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 left: 0.875em;
		 width: 0.0;
		 transform: translateY(0);
		 visibility: hidden;
	}
}
 @keyframes device-watch-crown-anim {
	 from {
		 animation-timing-function: steps(1, end);
		 transform: translate(0, 0.375em);
		 visibility: hidden;
	}
	 62.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 transform: translate(0, 0.375em);
		 visibility: visible;
	}
	 75%, 87.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 transform: translate(0.375em, 0);
		 visibility: visible;
	}
	 to {
		 transform: translate(0, 0.25em);
		 visibility: visible;
	}
}
 @keyframes device-monitor-stand-y-anim {
	 from, to {
		 animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
		 transform: translateY(0);
		 visibility: visible;
	}
	 10%, 12.5% {
		 animation-timing-function: steps(1, start);
		 transform: translateY(0.75em);
		 visibility: visible;
	}
	 25% {
		 animation-timing-function: steps(1, start);
		 top: 2.25em;
		 left: 1.875em;
		 transform: translateY(0.75em);
		 visibility: hidden;
	}
	 87.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 transform: translateY(0.75em);
		 visibility: hidden;
	}
}
 @keyframes device-monitor-stand-x-anim {
	 from, to {
		 animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
		 transform: translateY(0);
		 visibility: visible;
		 width: 2em;
	}
	 10%, 12.5% {
		 animation-timing-function: steps(1, start);
		 transform: translateY(0.75em);
		 visibility: visible;
		 width: 2em;
	}
	 25% {
		 animation-timing-function: steps(1, start);
		 top: 3em;
		 left: 1em;
		 width: 2em;
		 transform: translateY(0.75em);
		 visibility: hidden;
		 width: 2em;
	}
	 87.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 left: 1.5em;
		 transform: translateY(0.75em);
		 visibility: hidden;
		 width: 1em;
	}
}
 @keyframes watch-strap-t-anim {
	 from {
		 animation-timing-function: steps(1, end);
		 transform: translateY(0.25em);
		 visibility: hidden;
	}
	 62.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 transform: translateY(0.25em);
		 visibility: visible;
	}
	 75% {
		 animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
		 transform: translateY(-0.75em);
	}
	 87.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 transform: translateY(0);
	}
	 to {
		 transform: translateY(-0.75em);
	}
}
 @keyframes watch-strap-b-anim {
	 from {
		 animation-timing-function: steps(1, end);
		 transform: translateY(1.5em);
		 visibility: hidden;
	}
	 62.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 transform: translateY(1.5em);
		 visibility: visible;
	}
	 75% {
		 animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
		 transform: translateY(0.75em);
	}
	 87.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 transform: translateY(1.5em);
	}
	 to {
		 transform: translateY(0);
	}
}
 @keyframes device-shadow-a-anim {
	 from {
		 animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
		 filter: blur(0.375em);
	}
	 12.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 filter: blur(0.1875em);
		 opacity: 0.5;
	}
	 25%, to {
		 filter: blur(0.375em);
		 opacity: 0;
	}
}
 @keyframes device-shadow-b-anim {
	 from, 12.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 background-color: var(--device-color);
		 filter: blur(0.1875em);
		 opacity: 0;
	}
	 25% {
		 animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
		 background-color: var(--device-color);
		 filter: blur(0.375em);
		 opacity: 0.5;
	}
	 37.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 filter: blur(0.1875em);
		 opacity: 0.5;
		 left: 0;
		 width: 4em;
	}
	 50%, 75%, to {
		 animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
		 filter: blur(0.375em);
		 opacity: 0.5;
		 left: 1em;
		 width: 2em;
	}
	 62.5%, 87.5% {
		 animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
		 filter: blur(0.1875em);
		 opacity: 0.5;
		 left: 1em;
		 width: 2em;
	}
}
 
    </style>
</head>
<body>
    <div class="device">
	
	<div class="device_monitor_stand_y"></div>
	<div class="device_monitor_stand_x"></div>
	<div class="watch_strap_t"></div>
	<div class="watch_strap_b"></div>
    <div class="device_screen">
        <div class="device_home_btn"></div>
        <div class="device_watch_crown"></div>
    </div>
	<div class="device_shadow_a"></div>
	<div class="device_shadow_b"></div>
</div>
</body>
</html>
